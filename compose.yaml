services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gen_service
      POSTGRES_USER: gen_service
      POSTGRES_PASSWORD: gen_service
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gen_service -d gen_service"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    environment:
      APP_DATABASE_URL: postgresql://gen_service_app:gen_service_app@db:5432/gen_service
      WEBHOOK_SECRET: test-secret
      PROVIDER_ALPHA_URL: http://alpha:8001
      PROVIDER_BETA_URL: http://beta:8002
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      alpha:
        condition: service_started
      beta:
        condition: service_started

  alpha:
    build: .
    command: ["uvicorn", "app.fake_provider:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      APP_CALLBACK_URL: http://app:8000
      FAKE_PROVIDER_DELAY_SECONDS: "1"
      FAKE_PROVIDER_FAILURE_TYPE: ${FAKE_PROVIDER_ALPHA_FAILURE_TYPE:-technical}
      FAKE_PROVIDER_FAILURE_PROMPT: ${FAKE_PROVIDER_ALPHA_FAILURE_PROMPT:-Provider fallback test}
      FAKE_PROVIDER_SYNC_FAILURE_PROMPT: ${FAKE_PROVIDER_ALPHA_SYNC_FAILURE_PROMPT:-Provider synchronous failure test}
      PROVIDER_NAME: alpha
      WEBHOOK_SECRET: test-secret

  beta:
    build: .
    command: ["uvicorn", "app.fake_provider:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      APP_CALLBACK_URL: http://app:8000
      FAKE_PROVIDER_DELAY_SECONDS: "1"
      PROVIDER_NAME: beta
      WEBHOOK_SECRET: test-secret

  migrate:
    build: .
    command: ["alembic", "-c", "pyproject.toml", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://gen_service:gen_service@db:5432/gen_service
    depends_on:
      db:
        condition: service_healthy
