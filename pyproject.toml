[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "gen-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic==1.20.1",
    "asyncpg==0.32.0",
    "fastapi==0.162.0",
    "sqlalchemy[asyncio]==2.1.6",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
test = [
    "asyncpg-stubs==0.32.0",
    "httpx==0.28.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.alembic]
script_location = "%(here)s/migrations"
prepend_sys_path = ["."]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["app"]
